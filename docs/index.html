*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

body{background:#050D1A;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#C8D8F0;font-size:14px;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}

.scroll{overflow-y:auto;overflow-x:hidden;}
.scroll::-webkit-scrollbar{width:3px;}
.scroll::-webkit-scrollbar-track{background:transparent;}
.scroll::-webkit-scrollbar-thumb{background:#CAAB4A55;border-radius:2px;}
@keyframes fillBar{from{width:0;}to{width:var(--w);}}
.bar-fill{animation:fillBar 1.2s ease-out forwards;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
.blink{animation:blink 1s infinite;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.fade-in{animation:fadeIn 0.3s ease-out;}
@keyframes newsFlash{0%,100%{background:#CAAB4A22;border-color:#CAAB4A88;}50%{background:#CAAB4A44;border-color:#CAAB4A;}}
.news-flash{animation:newsFlash 1.5s infinite;}
.nav-btn:not(.nav-btn-active):hover{color:#CAAB4A !important;background:#0D1E35;}
.nav-btn:not(.nav-btn-active):active{color:#EEF4FF !important;background:#0D1E35;}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.02) 3px,rgba(0,0,0,0.02) 4px);pointer-events:none;z-index:9999;}
@keyframes shimmer{0%{background-position:-400px 0;}100%{background-position:400px 0;}}
.skel{background:linear-gradient(90deg,#0D1E35 25%,#132A48 37%,#0D1E35 63%);background-size:800px 100%;animation:shimmer 1.4s ease infinite;border-radius:6px;}
.squad-card{transition:transform 0.15s,border-color 0.15s,box-shadow 0.15s;}
.squad-card:hover{transform:translateY(-2px);border-color:#CAAB4A88 !important;box-shadow:0 6px 16px #0008;}
input:focus{border-color:#CAAB4A !important;box-shadow:0 0 0 3px #CAAB4A22;}
input::placeholder{color:#4A6A8A;}
</style>

le). Complication: Vicario wants ~\u20AC4m/yr after tax, above Juve's wage discipline, and Juve's actual first choice is Aston Villa's Emi Mart\xEDnez (who Villa won't sell) \u2014 Vicario is the fallback. A loan-with-option is being discussed as a compromise. Drags into August."},{player:"C. Romero",note:"COMPLETED \u2014 permanent transfer to Atl\xE9tico Madrid for a reported \xA334m, with Spurs retaining a 15% sell-on clause. Four-year contract plus an optional year."},{player:"P. Sarr",note:"NEW 31 Jul (Twitter Pulse, anonymous-sourced only \u2014 no Newsworthy corroboration yet, treat as early-stage): Aston Villa preparing a bid, described as holding 'serious interest.' Personal terms reportedly not expected to be an issue. A German club is also credited with interest."},{player:"L. Bergvall",note:"Handed in a transfer request citing lack of first-team football (112 mins under De Zerbi all season). Nottingham Forest had an opening \xA338m bid rejected and are expected to return with an improved offer \u2014 the chance to work under Oliver Glasner is reportedly a big pull for the player. Spurs are willing to sell but only on their valuation; will keep him if it isn't met."},{player:"Richarlison",note:"Spurs are ready to sell with a year left on his deal, partly to manage Profit & Sustainability Rules headroom after the Fernandes/Tonali spend. Asking price reported between \u20AC20-30m. Juventus have joined the race as a fallback if their move for PSG's Kolo Muani fails; an unnamed Turkish club and Orlando City (MLS) have also been mentioned, Everton links have gone cold."},{player:"J. Palhinha",note:"Loan spell ended and Tottenham's move to sign him permanently is now 100% dead (reliable reporting, 10 Jul) \u2014 the player has posted a farewell message to Spurs fans, contract expired 30 Jun. No permanent destination confirmed yet: Sporting CP are the most consistent link (Palhinha open to a return to Portugal) with Bayern wanting a sale rather than a loan; Benf
