<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>THFC Dashboard</title>
<meta name="description" content="Tottenham Hotspur fan dashboard — live squad, injuries, fixtures, transfers and news."/>
<meta name="theme-color" content="#050D1A"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23132257'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='%23CAAB4A' font-family='sans-serif' font-weight='900'%3ES%3C/text%3E%3C/svg%3E"/>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23132257'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='%23CAAB4A' font-family='sans-serif' font-weight='900'%3ES%3C/text%3E%3C/svg%3E"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>

<!-- React/ReactDOM loaded as UMD builds from CDN. The app bundle itself
     (below) is precompiled ahead of time by build.js via esbuild — no
     Babel-in-browser, no runtime JSX parsing, minified. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{width:100%;height:100%;overflow:hidden;}
body{background:#050D1A;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#C8D8F0;font-size:14px;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
.app-shell{height:100vh;height:100dvh;}
.scroll{overflow-y:auto;overflow-x:hidden;}
.scroll::-webkit-scrollbar{width:3px;}
.scroll::-webkit-scrollbar-track{background:transparent;}
.scroll::-webkit-scrollbar-thumb{background:#CAAB4A55;border-radius:2px;}
@keyframes fillBar{from{width:0;}to{width:var(--w);}}
.bar-fill{animation:fillBar 1.2s ease-out forwards;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
.blink{animation:blink 1s infinite;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.fade-in{animation:fadeIn 0.3s ease-out;}
@keyframes newsFlash{0%,100%{background:#CAAB4A22;border-color:#CAAB4A88;}50%{background:#CAAB4A44;border-color:#CAAB4A;}}
.news-flash{animation:newsFlash 1.5s infinite;}
.nav-btn:not(.nav-btn-active):hover{color:#CAAB4A !important;background:#0D1E35;}
.nav-btn:not(.nav-btn-active):active{color:#EEF4FF !important;background:#0D1E35;}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.02) 3px,rgba(0,0,0,0.02) 4px);pointer-events:none;z-index:9999;}
@keyframes shimmer{0%{background-position:-400px 0;}100%{background-position:400px 0;}}
.skel{background:linear-gradient(90deg,#0D1E35 25%,#132A48 37%,#0D1E35 63%);background-size:800px 100%;animation:shimmer 1.4s ease infinite;border-radius:6px;}
.squad-card{transition:transform 0.15s,border-color 0.15s,box-shadow 0.15s;}
.squad-card:hover{transform:translateY(-2px);border-color:#CAAB4A88 !important;box-shadow:0 6px 16px #0008;}
input:focus{border-color:#CAAB4A !important;box-shadow:0 0 0 3px #CAAB4A22;}
input::placeholder{color:#4A6A8A;}
</style>
</head>
<body>
<div id="root"></div>
<script>
/*__BUNDLE__*/
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
